<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triage — Wildfire Replay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a14;
      color: #c8c8e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 12px;
    }

    #header { text-align: center; }
    #header h1 { font-size: 22px; font-weight: 700; color: #e8e8ff; letter-spacing: 0.05em; }
    #meta-line { color: #5858a0; font-size: 12px; margin-top: 4px; font-family: monospace; }

    #main-layout { display: flex; gap: 16px; align-items: flex-start; }

    #canvas-wrap {
      background: #0a0a14;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      overflow: hidden;
    }

    #grid-canvas { display: block; }

    #stats-panel {
      width: 210px;
      background: #141428;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .stat-block { display: flex; flex-direction: column; gap: 1px; }
    .stat-label { font-size: 9px; letter-spacing: 0.14em; color: #5050a0; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-family: monospace; font-weight: 700; color: #e0e0ff; }
    .stat-value.danger { color: #ff6060; }
    .stat-value.good { color: #44ff88; }
    .stat-value.warn  { color: #ffcc44; }

    hr.divider { border: none; border-top: 1px solid #2a2a45; }

    .legend-title { font-size: 9px; letter-spacing: 0.14em; color: #5050a0; text-transform: uppercase; margin-bottom: 6px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 3px; color: #a0a0c0; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    #controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #141428;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      padding: 10px 14px;
      width: 100%;
      max-width: 738px;
    }

    .ctrl-btn {
      background: #222240;
      border: 1px solid #3a3a60;
      border-radius: 6px;
      color: #e0e0ff;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 6px 9px;
      transition: background 0.1s;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { background: #3a3a60; }
    .ctrl-btn:disabled { opacity: 0.25; cursor: default; }

    #progress-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }

    #progress-bar-outer {
      height: 6px;
      background: #222240;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    #progress-bar-fill {
      height: 100%;
      background: #4466ff;
      border-radius: 3px;
      width: 0%;
      pointer-events: none;
      transition: width 0.1s;
    }
    #turn-label { font-family: monospace; font-size: 10px; color: #5858a0; text-align: center; }

    .speed-wrap { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #5858a0; flex-shrink: 0; }
    #speed-slider { width: 56px; accent-color: #4466ff; cursor: pointer; }

    #load-btn {
      background: #222240;
      border: 1px solid #3a3a60;
      border-radius: 6px;
      color: #8080b0;
      cursor: pointer;
      font-size: 11px;
      padding: 6px 10px;
      flex-shrink: 0;
    }
    #load-btn:hover { background: #3a3a60; }
    #file-input { display: none; }

    #action-log {
      width: 100%;
      max-width: 738px;
      background: #141428;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 11px;
      min-height: 54px;
    }
    #log-header { color: #5050a0; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 5px; }
    #log-content { color: #8899cc; line-height: 1.7; }
  </style>
</head>
<body>

<div id="header">
  <h1>&#x1F525; Triage &mdash; Wildfire Resource Allocation</h1>
  <div id="meta-line">SWECCATHON 2026 &middot; mesocosm benchmark</div>
</div>

<div id="main-layout">
  <div id="canvas-wrap">
    <canvas id="grid-canvas" width="500" height="500"></canvas>
  </div>

  <div id="stats-panel">
    <div class="stat-block">
      <div class="stat-label">Turn</div>
      <div class="stat-value" id="stat-turn">&mdash;</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="stat-score">&mdash;</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Lives Lost</div>
      <div class="stat-value danger" id="stat-lives">&mdash;</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Cells Burned</div>
      <div class="stat-value danger" id="stat-cells">&mdash;</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Norm Score</div>
      <div class="stat-value" id="stat-norm">&mdash;</div>
    </div>

    <hr class="divider">

    <div>
      <div class="legend-title">Legend</div>
      <div class="legend-item">
        <div class="legend-swatch" style="background:#1a3870"></div>
        <span>Population</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background:#ff9900"></div>
        <span>Fire (low)</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background:#ff1100"></div>
        <span>Fire (high)</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background:#ff1100; outline: 2px solid #ff9900; outline-offset: 1px;"></div>
        <span>Pop + fire</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#00ff88"></div>
        <span>Crew 0</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#00ccff"></div>
        <span>Crew 1</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#ffff00"></div>
        <span>Crew 2</span>
      </div>
    </div>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="btn-reset" title="Reset">&#x23EE;</button>
  <button class="ctrl-btn" id="btn-back"  title="Step back">&#x23EA;</button>
  <button class="ctrl-btn" id="btn-play"  title="Play / Pause">&#x25B6;</button>
  <button class="ctrl-btn" id="btn-step"  title="Step forward">&#x23E9;</button>

  <div id="progress-wrap">
    <div id="progress-bar-outer">
      <div id="progress-bar-fill"></div>
    </div>
    <div id="turn-label">Load a replay to begin</div>
  </div>

  <div class="speed-wrap">
    <span>Speed</span>
    <input type="range" id="speed-slider" min="1" max="10" value="3">
    <span id="speed-label">3&times;</span>
  </div>

  <button id="load-btn">Load File</button>
  <input type="file" id="file-input" accept=".json">
</div>

<div id="action-log">
  <div id="log-header">Actions This Turn</div>
  <div id="log-content">&mdash;</div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let steps = [];
let meta  = { scenario: '?', agent: '?', seed: '?' };
let currentIdx = 0;
let playing   = false;
let playTimer = null;
let knownCells = {};  // key → last-seen cell data

const CREW_COLORS = ['#00ff88', '#00ccff', '#ffff00', '#ff44ff'];

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('grid-canvas');
const ctx    = canvas.getContext('2d');

function fireFill(intensity) {
  const t = Math.min(1, intensity / 100);
  const r = 255;
  const g = Math.round(140 * (1 - t));
  return `rgb(${r},${g},0)`;
}

function drawGrid(obs) {
  const W = obs.grid_width  || 14;
  const H = obs.grid_height || 14;
  const SZ = 500;
  canvas.width  = SZ;
  canvas.height = SZ;
  const cw = SZ / W;
  const ch = SZ / H;

  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, SZ, SZ);

  // Index current step
  const cur = {};
  for (const c of (obs.cells || [])) cur[`${c.x},${c.y}`] = c;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const key = `${x},${y}`;
      const cell   = cur[key] || knownCells[key];
      const dimmed = !cur[key] && !!knownCells[key];
      const px = x * cw + 1, py = y * ch + 1, pw = cw - 2, ph = ch - 2;

      if (!cell) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#12121f';
        ctx.fillRect(px, py, pw, ph);
        continue;
      }

      ctx.globalAlpha = dimmed ? 0.4 : 1;

      if (cell.on_fire) {
        const fill = fireFill(cell.intensity);
        if (!dimmed) {
          ctx.shadowColor = fill;
          ctx.shadowBlur  = cell.pop > 0 ? 20 : 10;
        }
        ctx.fillStyle = cell.pop > 0 ? '#ff1100' : fill;
        ctx.fillRect(px, py, pw, ph);
        ctx.shadowBlur = 0;
      } else if (cell.pop > 0) {
        ctx.fillStyle = '#1a3870';
        ctx.fillRect(px, py, pw, ph);
      } else {
        ctx.fillStyle = '#1c1c30';
        ctx.fillRect(px, py, pw, ph);
      }
      ctx.globalAlpha = 1;
    }
  }

  // Crews
  for (const crew of (obs.crews || [])) {
    const [cx, cy] = crew.cell;
    const px = cx * cw + cw / 2;
    const py = cy * ch + ch / 2;
    const r  = Math.min(cw, ch) * 0.30;
    const color = CREW_COLORS[crew.id % CREW_COLORS.length];

    ctx.shadowColor = color;
    ctx.shadowBlur  = 10;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.shadowBlur = 0;

    const fs = Math.max(7, Math.round(r * 0.85));
    ctx.fillStyle = '#000';
    ctx.font = `bold ${fs}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(crew.id), px, py + 0.5);
  }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats(step) {
  const obs  = step.observation;
  const info = step.info || {};
  const total = steps.length - 1;

  document.getElementById('stat-turn').textContent =
    `${obs.turn} / ${obs.max_turns}`;

  document.getElementById('stat-score').textContent =
    typeof obs.score === 'number' ? obs.score.toLocaleString() : '—';

  document.getElementById('stat-lives').textContent =
    info.lives_lost != null ? info.lives_lost.toLocaleString() : '—';

  document.getElementById('stat-cells').textContent =
    info.cells_burned != null ? info.cells_burned.toLocaleString() : '—';

  const normEl = document.getElementById('stat-norm');
  if (info.norm_score != null) {
    const n = info.norm_score;
    normEl.textContent = n.toFixed(4);
    normEl.className = 'stat-value ' + (n >= 1 ? 'good' : n >= 0 ? 'warn' : 'danger');
  } else {
    normEl.textContent = '—';
    normEl.className = 'stat-value';
  }

  const pct = total > 0 ? (currentIdx / total) * 100 : 0;
  document.getElementById('progress-bar-fill').style.width = pct + '%';
  document.getElementById('turn-label').textContent =
    `Step ${currentIdx + 1} / ${total + 1}`;
}

function fmtCmd(cmd) {
  if (!cmd) return '';
  const id = cmd.crew ?? cmd.crew_id ?? '?';
  const type = cmd.action ?? cmd.type ?? '?';
  const to = cmd.to || (cmd.x != null ? [cmd.x, cmd.y] : null);
  switch (type) {
    case 'move':     return `crew ${id}: move → (${to})`;
    case 'suppress': return `crew ${id}: suppress`;
    case 'prep':     return `crew ${id}: prep`;
    case 'evacuate': return to ? `crew ${id}: evacuate → (${to})` : `crew ${id}: evacuate`;
    default:         return JSON.stringify(cmd);
  }
}

function updateActionLog(action) {
  const el = document.getElementById('log-content');
  if (!action) { el.innerHTML = '<span style="color:#333366">(terminal state)</span>'; return; }
  const cmds = action.commands || [];
  if (!cmds.length) { el.textContent = '(no commands)'; return; }
  el.innerHTML = cmds.map(c => `<div>${fmtCmd(c)}</div>`).join('');
}

// ── Core navigation ───────────────────────────────────────────────────────────
function buildKnownCells(upTo) {
  const kc = {};
  for (let i = 0; i <= upTo; i++) {
    for (const c of (steps[i].observation.cells || [])) {
      kc[`${c.x},${c.y}`] = { ...c };
    }
  }
  return kc;
}

function gotoStep(idx) {
  if (!steps.length) return;
  idx = Math.max(0, Math.min(idx, steps.length - 1));
  currentIdx = idx;
  knownCells = buildKnownCells(idx);
  const step = steps[idx];
  drawGrid(step.observation);
  updateStats(step);
  updateActionLog(step.action);
}

function advanceStep() {
  // Fast path: only merge new cells (no rebuild)
  currentIdx++;
  const step = steps[currentIdx];
  for (const c of (step.observation.cells || [])) {
    knownCells[`${c.x},${c.y}`] = { ...c };
  }
  drawGrid(step.observation);
  updateStats(step);
  updateActionLog(step.action);
}

// ── Playback ──────────────────────────────────────────────────────────────────
function setPlaying(val) {
  playing = val;
  document.getElementById('btn-play').innerHTML = playing ? '&#x23F8;' : '&#x25B6;';
  if (!playing && playTimer) { clearTimeout(playTimer); playTimer = null; }
  if (playing) scheduleNext();
}

function scheduleNext() {
  if (!playing) return;
  const speed = parseInt(document.getElementById('speed-slider').value, 10);
  playTimer = setTimeout(() => {
    if (currentIdx < steps.length - 1) {
      advanceStep();
      scheduleNext();
    } else {
      setPlaying(false);
    }
  }, 1000 / speed);
}

// ── Loading ───────────────────────────────────────────────────────────────────
function normalizeTrace(data) {
  if (data.format === 'triage-local-v1') {
    meta = { scenario: data.scenario || '?', agent: data.agent || '?', seed: data.seed ?? '?' };
    return data.steps;
  }
  if (data.replay) {
    meta = { scenario: data.domain_id || '?', agent: 'model', seed: '?' };
    const ep = Object.values(data.replay)[0] || [];
    return ep.map(s => ({
      turn: s.step,
      observation: s.observation,
      action: typeof s.action === 'string'
        ? (() => { try { return JSON.parse(s.action); } catch { return s.action; } })()
        : s.action,
      reward: s.reward,
      terminated: s.terminated,
      truncated: false,
      info: {},
    }));
  }
  return [];
}

function loadTrace(data) {
  setPlaying(false);
  knownCells = {};
  steps = normalizeTrace(data);
  if (!steps.length) { alert('Could not parse replay — check format.'); return; }

  document.getElementById('meta-line').textContent =
    `scenario: ${meta.scenario}  ·  agent: ${meta.agent}  ·  seed: ${meta.seed}`;

  gotoStep(0);
}

// ── Wiring ────────────────────────────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => { setPlaying(false); gotoStep(0); });
document.getElementById('btn-back').addEventListener('click',  () => { setPlaying(false); gotoStep(currentIdx - 1); });
document.getElementById('btn-play').addEventListener('click',  () => { if (steps.length) setPlaying(!playing); });
document.getElementById('btn-step').addEventListener('click',  () => { setPlaying(false); if (currentIdx < steps.length - 1) advanceStep(); });

document.getElementById('speed-slider').addEventListener('input', function () {
  document.getElementById('speed-label').textContent = this.value + '×';
});

document.getElementById('progress-bar-outer').addEventListener('click', function (e) {
  if (!steps.length) return;
  setPlaying(false);
  const t = (e.clientX - this.getBoundingClientRect().left) / this.offsetWidth;
  gotoStep(Math.round(t * (steps.length - 1)));
});

document.getElementById('load-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try { loadTrace(JSON.parse(e.target.result)); }
    catch (err) { alert('JSON parse error: ' + err.message); }
  };
  reader.readAsText(file);
});

// ── Auto-load ─────────────────────────────────────────────────────────────────
fetch('./data/replay.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(loadTrace)
  .catch(() => {
    ctx.fillStyle = '#12121f';
    ctx.fillRect(0, 0, 500, 500);
    ctx.fillStyle = '#2a2a50';
    ctx.font = '13px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('No replay loaded', 250, 230);
    ctx.font = '10px monospace';
    ctx.fillStyle = '#1e1e40';
    ctx.fillText('python run_local.py --agent greedy --scenario heartland', 250, 255);
    ctx.fillText('     --trace-out showcase/data/replay.json', 250, 270);
    ctx.fillText('then: cd showcase && python -m http.server 8080', 250, 295);
  });
</script>
</body>
</html>
